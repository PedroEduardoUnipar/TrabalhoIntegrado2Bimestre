spring:
  application:
    name: loja-integrada
  profiles:
    default: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: loja-integrada
    duration: PT2H
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
